name: Daily PR Dashboard

on:
    schedule:
        - cron: "0 20 * * 0-4" # Mon - Fri at 8 AM UTC
    workflow_dispatch: # Allows manual execution

env:
    REPOS_TO_MONITOR: "rentico/renti-backend, rentico/renti-web, rentico/renti-forms, rentico/renti-schemas, rentico/stats-service, rentico/calendar-integration-service, rentico/document-exporter"

jobs:
    pr-dashboard:
        runs-on: ubuntu-latest
        steps:
            - name: Get all open PRs across organization
              id: get_prs
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.ORG_GITHUB_TOKEN }}
                  script: |
                      const owner = context.repo.owner;
                      let allPRs = [];
                      let repos = [];

                      // Check if manual repo list is provided
                      const reposToMonitor = process.env.REPOS_TO_MONITOR || '';

                      if (reposToMonitor.trim()) {
                        // Use manual list
                        console.log('Using manual repository list');
                        const repoList = reposToMonitor.split(',').map(r => r.trim());

                        repos = repoList.map(repoFullName => {
                          const [repoOwner, repoName] = repoFullName.split('/');
                          return {
                            name: repoName,
                            owner: { login: repoOwner }
                          };
                        });

                        console.log(`Monitoring ${repos.length} repositories: ${repoList.join(', ')}`);
                      } else {
                        // Try to get all repos from organization
                        try {
                          console.log(`Attempting to fetch repos for organization: ${owner}`);
                          repos = await github.paginate(github.rest.repos.listForOrg, {
                            org: owner,
                            type: 'all',
                            per_page: 100
                          });
                          console.log(`Found ${repos.length} repositories in organization`);
                        } catch (error) {
                          console.log(`Not an organization or insufficient permissions: ${error.message}`);
                          console.log(`Falling back to current repository only`);
                          // Fallback to just the current repo
                          repos = [{
                            name: context.repo.repo,
                            owner: { login: owner }
                          }];
                        }
                      }

                      for (const repo of repos) {
                        try {
                          const repoOwner = repo.owner.login;
                          console.log(`Fetching PRs for ${repoOwner}/${repo.name}...`);

                          // Get open PRs for each repo
                          const prs = await github.rest.pulls.list({
                            owner: repoOwner,
                            repo: repo.name,
                            state: 'open',
                            per_page: 100
                          });

                          console.log(`Found ${prs.data.length} open PRs in ${repo.name}`);

                          for (const pr of prs.data) {
                            // Skip draft PRs
                            if (pr.draft) {
                              console.log(`Skipping draft PR #${pr.number} in ${repo.name}`);
                              continue;
                            }

                            // Get reviews for this PR
                            const reviews = await github.rest.pulls.listReviews({
                              owner: repoOwner,
                              repo: repo.name,
                              pull_number: pr.number
                            });

                            // Count unique approvals (latest review from each reviewer)
                            const reviewerStates = {};
                            reviews.data.forEach(review => {
                              reviewerStates[review.user.login] = review.state;
                            });

                            const approvalCount = Object.values(reviewerStates).filter(state => state === 'APPROVED').length;
                            const changesRequested = Object.values(reviewerStates).some(state => state === 'CHANGES_REQUESTED');

                            // Check if mergeable - this is what determines if the "Merge" button is enabled
                            const mergeable = pr.mergeable;
                            const mergeableState = pr.mergeable_state;

                            // Determine status based on GitHub's merge button state
                            let statusEmoji = '⏳';
                            let statusText = 'Pending Review';
                            let readyToMerge = false;

                            // Ready to merge = GitHub's "Merge" button is enabled
                            // This respects branch protection rules, required approvals, checks, etc.
                            if (mergeableState === 'clean') {
                              statusEmoji = '🎯';
                              statusText = 'Ready to Merge';
                              readyToMerge = true;
                            } else if (changesRequested) {
                              statusEmoji = '🔴';
                              statusText = 'Changes Requested';
                            } else if (mergeableState === 'blocked') {
                              statusEmoji = '⏳';
                              statusText = approvalCount > 0 ? `Approved (${approvalCount}) - Blocked` : 'Blocked';
                            } else if (mergeableState === 'behind') {
                              statusEmoji = '⏳';
                              statusText = approvalCount > 0 ? `Approved (${approvalCount}) - Behind` : 'Behind';
                            } else if (mergeableState === 'dirty') {
                              statusEmoji = '⚠️';
                              statusText = 'Conflicts';
                            } else if (approvalCount > 0) {
                              statusEmoji = '✅';
                              statusText = `Approved (${approvalCount})`;
                            }

                            console.log(`PR #${pr.number} (${repo.name}): mergeable=${mergeable}, mergeableState=${mergeableState}, approvals=${approvalCount}, readyToMerge=${readyToMerge}`);

                            allPRs.push({
                              repo: repo.name,
                              title: pr.title,
                              author: pr.user.login,
                              url: pr.html_url,
                              statusEmoji: statusEmoji,
                              statusText: statusText,
                              approvalCount: approvalCount,
                              readyToMerge: readyToMerge,
                              created: pr.created_at,
                              number: pr.number
                            });
                          }
                        } catch (error) {
                          console.log(`Error fetching PRs for ${repo.name}:`, error.message);
                        }
                      }

                      console.log(`Total PRs collected: ${allPRs.length}`);

                      // Sort: Ready to merge first, then by date
                      allPRs.sort((a, b) => {
                        if (a.readyToMerge && !b.readyToMerge) return -1;
                        if (!a.readyToMerge && b.readyToMerge) return 1;
                        return new Date(b.created) - new Date(a.created);
                      });

                      return allPRs;

            - name: Build Slack message
              id: build_message
              uses: actions/github-script@v7
              with:
                  script: |
                      const prs = ${{ steps.get_prs.outputs.result }};

                      if (prs.length === 0) {
                        return {
                          text: "🎉 *No open Pull Requests!* Everyone's inbox is clear!",
                          blocks: [
                            {
                              "type": "header",
                              "text": {
                                "type": "plain_text",
                                "text": "📊 Daily PR Dashboard"
                              }
                            },
                            {
                              "type": "section",
                              "text": {
                                "type": "mrkdwn",
                                "text": "🎉 *No open Pull Requests!*\n\nGreat job team! All PRs have been reviewed and merged."
                              }
                            }
                          ]
                        };
                      }

                      // Group PRs by status
                      const readyToMergePRs = prs.filter(pr => pr.readyToMerge);
                      const changesRequestedPRs = prs.filter(pr => pr.statusText === 'Changes Requested');
                      const approvedPRs = prs.filter(pr => pr.approvalCount > 0 && !pr.readyToMerge && pr.statusText !== 'Changes Requested');
                      const needsReviewPRs = prs.filter(pr => pr.approvalCount === 0 && pr.statusText !== 'Changes Requested');

                      // Build PR list blocks
                      let prBlocks = [];

                      const addPRSection = (title, prList) => {
                        if (prList.length === 0) return;

                        prBlocks.push({
                          "type": "section",
                          "text": {
                            "type": "mrkdwn",
                            "text": `*${title}*`
                          }
                        });

                        prList.forEach(pr => {
                          const createdDate = new Date(pr.created).toLocaleDateString('en-US', {
                            month: 'short',
                            day: 'numeric'
                          });

                          const approvalInfo = pr.approvalCount > 0 ? ` • ${pr.approvalCount}✅` : '';

                          prBlocks.push({
                            "type": "section",
                            "text": {
                              "type": "mrkdwn",
                              "text": `<${pr.url}|*${pr.title}*>\n\`${pr.repo}\` • @${pr.author} • ${createdDate}${approvalInfo}`
                            }
                          });
                        });

                        prBlocks.push({
                          "type": "divider"
                        });
                      };

                      // Add sections in priority order
                      addPRSection('🎯 Ready to Merge', readyToMergePRs);
                      addPRSection('🔴 Changes Requested', changesRequestedPRs);
                      addPRSection('✅ Approved', approvedPRs);
                      addPRSection('⏳ Needs Review', needsReviewPRs);

                      // Remove last divider
                      if (prBlocks.length > 0) {
                        prBlocks.pop();
                      }

                      return {
                        text: `📊 Daily PR Dashboard - ${prs.length} open PR(s)`,
                        blocks: [
                          {
                            "type": "header",
                            "text": {
                              "type": "plain_text",
                              "text": "📊 Daily PR Dashboard"
                            }
                          },
                          {
                            "type": "section",
                            "text": {
                              "type": "mrkdwn",
                              "text": `📋 ${prs.length} open • 🎯 ${readyToMergePRs.length} ready • ⏳ ${needsReviewPRs.length} pending • 🔴 ${changesRequestedPRs.length} blocked`
                            }
                          },
                          {
                            "type": "divider"
                          },
                          ...prBlocks
                        ]
                      };

            - name: Send dashboard to Slack
              uses: slackapi/slack-github-action@v1.26.0
              with:
                  payload: ${{ steps.build_message.outputs.result }}
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.PR_SLACK_WEBHOOK_URL }}
                  SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
