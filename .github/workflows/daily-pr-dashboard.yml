name: Daily PR Dashboard

on:
    schedule:
        - cron: "0 20 * * 0-4" # Mon - Fri at 8 AM UTC
    workflow_dispatch: # Allows manual execution

jobs:
    pr-dashboard:
        runs-on: ubuntu-latest
        steps:
            - name: Get all open PRs across organization
              id: get_prs
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const org = context.repo.owner;

                      // Get all repos in the organization
                      const repos = await github.paginate(github.rest.repos.listForOrg, {
                        org: org,
                        type: 'all',
                        per_page: 100
                      });

                      let allPRs = [];

                      for (const repo of repos) {
                        try {
                          // Get open PRs for each repo
                          const prs = await github.rest.pulls.list({
                            owner: org,
                            repo: repo.name,
                            state: 'open',
                            per_page: 100
                          });
                          
                          for (const pr of prs.data) {
                            // Get reviews for this PR
                            const reviews = await github.rest.pulls.listReviews({
                              owner: org,
                              repo: repo.name,
                              pull_number: pr.number
                            });
                            
                            // Count unique approvals (latest review from each reviewer)
                            const reviewerStates = {};
                            reviews.data.forEach(review => {
                              reviewerStates[review.user.login] = review.state;
                            });
                            
                            const approvalCount = Object.values(reviewerStates).filter(state => state === 'APPROVED').length;
                            const changesRequested = Object.values(reviewerStates).some(state => state === 'CHANGES_REQUESTED');
                            
                            // Check if mergeable
                            const mergeable = pr.mergeable;
                            const mergeableState = pr.mergeable_state;
                            
                            // Determine status
                            let statusEmoji = '⏳';
                            let statusText = 'Pending Review';
                            let readyToMerge = false;
                            
                            if (changesRequested) {
                              statusEmoji = '🔴';
                              statusText = 'Changes Requested';
                            } else if (approvalCount > 0 && mergeable && mergeableState === 'clean') {
                              statusEmoji = '✅';
                              statusText = 'Ready to Merge';
                              readyToMerge = true;
                            } else if (approvalCount > 0) {
                              statusEmoji = '✅';
                              statusText = `Approved (${approvalCount})`;
                            }
                            
                            allPRs.push({
                              repo: repo.name,
                              title: pr.title,
                              author: pr.user.login,
                              url: pr.html_url,
                              statusEmoji: statusEmoji,
                              statusText: statusText,
                              approvalCount: approvalCount,
                              readyToMerge: readyToMerge,
                              created: pr.created_at,
                              number: pr.number
                            });
                          }
                        } catch (error) {
                          console.log(`Error fetching PRs for ${repo.name}:`, error.message);
                        }
                      }

                      // Sort: Ready to merge first, then by date
                      allPRs.sort((a, b) => {
                        if (a.readyToMerge && !b.readyToMerge) return -1;
                        if (!a.readyToMerge && b.readyToMerge) return 1;
                        return new Date(b.created) - new Date(a.created);
                      });

                      return allPRs;

            - name: Build Slack message
              id: build_message
              uses: actions/github-script@v7
              with:
                  script: |
                      const prs = ${{ steps.get_prs.outputs.result }};

                      if (prs.length === 0) {
                        return {
                          text: "🎉 *No open Pull Requests!* Everyone's inbox is clear!",
                          blocks: [
                            {
                              "type": "header",
                              "text": {
                                "type": "plain_text",
                                "text": "📊 Daily PR Dashboard"
                              }
                            },
                            {
                              "type": "section",
                              "text": {
                                "type": "mrkdwn",
                                "text": "🎉 *No open Pull Requests!*\n\nGreat job team! All PRs have been reviewed and merged."
                              }
                            }
                          ]
                        };
                      }

                      // Count stats
                      const readyToMerge = prs.filter(pr => pr.readyToMerge).length;
                      const needsReview = prs.filter(pr => pr.approvalCount === 0).length;
                      const changesRequested = prs.filter(pr => pr.statusText === 'Changes Requested').length;

                      // Build PR list blocks
                      let prBlocks = [];

                      prs.forEach(pr => {
                        const createdDate = new Date(pr.created).toLocaleDateString('en-US', { 
                          month: 'short', 
                          day: 'numeric' 
                        });
                        
                        prBlocks.push({
                          "type": "section",
                          "text": {
                            "type": "mrkdwn",
                            "text": `${pr.statusEmoji} *<${pr.url}|#${pr.number} - ${pr.title}>*\n📦 \`${pr.repo}\` • 👤 @${pr.author} • 📅 ${createdDate}\n${pr.approvalCount > 0 ? `✅ ${pr.approvalCount} approval(s)` : '⏳ Awaiting review'} ${pr.readyToMerge ? '• 🎯 *Ready to merge!*' : ''}`
                          }
                        });
                        
                        prBlocks.push({
                          "type": "divider"
                        });
                      });

                      // Remove last divider
                      prBlocks.pop();

                      return {
                        text: `📊 Daily PR Dashboard - ${prs.length} open PR(s)`,
                        blocks: [
                          {
                            "type": "header",
                            "text": {
                              "type": "plain_text",
                              "text": "📊 Daily PR Dashboard"
                            }
                          },
                          {
                            "type": "section",
                            "text": {
                              "type": "mrkdwn",
                              "text": `*Summary of Open Pull Requests*\n\n📋 Total Open: *${prs.length}*\n✅ Ready to Merge: *${readyToMerge}*\n⏳ Needs Review: *${needsReview}*\n🔴 Changes Requested: *${changesRequested}*`
                            }
                          },
                          {
                            "type": "divider"
                          },
                          ...prBlocks
                        ]
                      };

            - name: Send dashboard to Slack
              uses: slackapi/slack-github-action@v1.26.0
              with:
                  payload: ${{ steps.build_message.outputs.result }}
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.PR_SLACK_WEBHOOK_URL }}
                  SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
