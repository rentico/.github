name: Reusable Slack PR Events Notification

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # ============================================
      # Step 1: Generate random messages (only for creating PR)
      # ============================================
      - name: Generate random message
        id: random_message
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          echo "message=📬 *New Pull Request Created*" >> $GITHUB_OUTPUT
          echo "emoji=📬" >> $GITHUB_OUTPUT

      # ============================================
      # EVENTO 1: PR Created
      # ============================================
      - name: Send notification - PR Created
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "📬 New Pull Request - ${{ github.repository }}",
              "attachments": [
                {
                  "color": "#2eb886",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "📝 *${{ github.event.pull_request.title }}*\n👤 <https://github.com/${{ github.event.pull_request.user.login }}|@${{ github.event.pull_request.user.login }}>\n🌿 `${{ github.event.pull_request.head.ref }}` → `${{ github.event.pull_request.base.ref }}`\n\n<${{ github.event.pull_request.html_url }}|View Pull Request>"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # ============================================
      # EVENT 2: PR Approved
      # ============================================
      - name: Check if PR is ready to merge (after approval)
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
        id: check_mergeable
        uses: actions/github-script@v7
        with:
          script: |
            // Wait a bit for GitHub to update mergeable state
            await new Promise(resolve => setTimeout(resolve, 5000));

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            // Check reviews
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            // Get unique reviewers and their latest review state
            const reviewerStates = {};
            reviews.data.forEach(review => {
              reviewerStates[review.user.login] = review.state;
            });

            const approvalCount = Object.values(reviewerStates).filter(state => state === 'APPROVED').length;
            const changesRequested = Object.values(reviewerStates).some(state => state === 'CHANGES_REQUESTED');

            // Check if mergeable
            const mergeable = pr.data.mergeable;
            const mergeableState = pr.data.mergeable_state;

            // Determine if ready to merge
            const readyToMerge = mergeable && !changesRequested && approvalCount > 0 && mergeableState === 'clean';

            return {
              readyToMerge: readyToMerge,
              approvalCount: approvalCount,
              mergeable: mergeable,
              mergeableState: mergeableState
            };

      - name: Send notification - PR Approved
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Pull Request Approved - ${{ github.repository }}",
              "attachments": [
                {
                  "color": "#36a64f",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "📝 *${{ github.event.pull_request.title }}*\n👨‍⚖️ Approved by <https://github.com/${{ github.event.review.user.login }}|@${{ github.event.review.user.login }}>\n👤 Author: <https://github.com/${{ github.event.pull_request.user.login }}|@${{ github.event.pull_request.user.login }}>${{ fromJSON(steps.check_mergeable.outputs.result).readyToMerge && '\n🎯 Ready to merge!' || '' }}\n\n<${{ github.event.pull_request.html_url }}|View Pull Request>"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # ============================================
      # EVENT 3: Changes requested
      # ============================================
      - name: Send notification - Changes Requested
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🔴 Changes Requested - ${{ github.repository }}",
              "attachments": [
                {
                  "color": "#ff0000",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "📝 *${{ github.event.pull_request.title }}*\n👨‍⚖️ <https://github.com/${{ github.event.review.user.login }}|@${{ github.event.review.user.login }}>\n👤 Author: <https://github.com/${{ github.event.pull_request.user.login }}|@${{ github.event.pull_request.user.login }}>\n\n<${{ github.event.pull_request.html_url }}|View Pull Request>"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # ============================================
      # EVENT 4: PR Comment
      # ============================================
      - name: Send notification - PR Comment
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "💬 New Comment - ${{ github.repository }}",
              "attachments": [
                {
                  "color": "#0366d6",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "📝 *${{ github.event.issue.title }}*\n👤 <https://github.com/${{ github.event.comment.user.login }}|@${{ github.event.comment.user.login }}>\n\n<${{ github.event.comment.html_url }}|View Comment>"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # ============================================
      # EVENT 5: Review Comment
      # ============================================
      - name: Send notification - Review Comment
        if: github.event_name == 'pull_request_review_comment'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "💬 Review Comment - ${{ github.repository }}",
              "attachments": [
                {
                  "color": "#ffa500",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "📝 *${{ github.event.pull_request.title }}*\n👤 <https://github.com/${{ github.event.comment.user.login }}|@${{ github.event.comment.user.login }}>\n📄 `${{ github.event.comment.path }}`\n\n<${{ github.event.comment.html_url }}|View Comment>"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
